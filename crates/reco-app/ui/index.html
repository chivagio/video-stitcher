<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reco</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!--
      Phase 2 preview shell (UI-SPEC Surface Layout Contract).

      The window is one full-window transparent webview composited ABOVE a
      Rust-owned native wgpu child view (the stitched panorama). The webview
      paints only the opaque chrome panels:

        * bottom transport strip (72px, full width) — opaque
        * right controls rail (40px collapsed / 280px expanded) — opaque

      The remaining TOP-LEFT region (#preview-region) is intentionally
      TRANSPARENT and UNPAINTED — the native panorama renders there. Never
      paint a background, border, or shadow over it (Phase 2 constraint 1).

      The webview never sizes, moves, or creates the native view, and no raw
      window handle crosses this boundary (CONTEXT D-02).

      NOTE: this task (02-01) restructures the chrome enough to drive the
      z-order/compositing probe. The full transport UI (timeline, timecode,
      play/pause/step/loop, view toggle, presenter badge) and the collapsible
      controls panel live in plans 02-04/02-05.
    -->
    <div id="preview-region" class="preview-region" aria-label="Panorama"></div>

    <div id="transport" class="transport" role="toolbar" aria-label="Transport and engine controls">
      <!-- The three Phase 1 buttons remain, solely so the probe can drive
           import → preview. Plan 02-05 replaces them with the real transport. -->
      <button id="import" class="control-btn" type="button">Import</button>
      <button id="preview" class="control-btn control-btn--primary" type="button">
        Start preview
      </button>
      <button id="export" class="control-btn" type="button">Export</button>
    </div>

    <div id="controls-rail" class="controls-rail" aria-label="Controls"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
