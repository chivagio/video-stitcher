name: Release App (Tauri)

# Builds the `reco-app` Tauri 2 bundles for macOS (DMG), Windows (NSIS/MSI)
# and Linux (AppImage/deb), and signs/notarizes them ONLY when the signing
# credentials are present as repository secrets (DIAG-04).
#
# With no signing secrets the signing steps are skipped, never failed (the
# DIAG-04 "no secrets" edge probe): Linux artifacts carry no signature and the
# macOS `.app`/`.dmg` is ad-hoc signed (`bundle.macOS.signingIdentity: "-"`) but
# not notarized. The seven secret names are recorded in
# `.planning/phases/01-walking-skeleton-native-surface-gate/01-CREDENTIALS.md` §4.
#
# This workflow does NOT bundle FFmpeg or ONNX Runtime into the installer:
# `tauri.conf.json` declares no `bundle.resources`, and the app requires those
# runtimes to be installed at runtime — see RUNTIME-PREREQUISITES.md (WR-03).
# ONNX Runtime is statically linked into the binary by `ort-sys`'s own
# `download-binaries` build path (the app enables the `ort` feature, not
# `load-dynamic`), so there is no ORT download step here. FFmpeg import
# libraries are downloaded only on Windows; the Linux/macOS builds use the
# system FFmpeg dev packages installed below.
#
# NOTE on the signing gates: GitHub Actions does NOT allow the `secrets`
# context inside a step-level `if:` ("Secrets cannot be directly referenced in
# if: conditionals" — docs.github.com/actions/security-guides/using-secrets-in-github-actions).
# Referencing `secrets.*` there fails the whole workflow at parse time. The
# documented workaround is used below: the secrets are exposed as *job-level*
# `env:` values, and the steps gate on `env.* != ''`. Job-level env is visible
# to step `if:` (step-level env is applied after `if:` is evaluated).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: App bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest

    # Secrets are hoisted to job scope so the signing steps can gate on their
    # presence via `if: env.<NAME> != ''` (see the note at the top of this file).
    # Only the *names* are referenced here; no value is ever committed.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: app-${{ matrix.name }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf xdg-utils \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libavdevice-dev libavfilter-dev libswresample-dev \
            pkg-config clang

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      # FFmpeg shared libraries for Windows — same BtbN n7.1 source the
      # existing `release.yml` uses so the app and CLI stay ABI-matched.
      # These provide the build-time import libraries; this workflow does NOT
      # copy the DLLs into the installer (see the header note / WR-03).
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ 'User-Agent' = 'reco-ci'; 'Authorization' = "Bearer $env:GH_TOKEN" }
          $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases?per_page=15"
          $asset = $null
          foreach ($r in $releases) {
            $asset = $r.assets | Where-Object { $_.name -like "*n7.1*win64-gpl-shared*.zip" } | Select-Object -First 1
            if ($asset) { break }
          }
          if (-not $asset) { throw "No n7.1 win64-gpl-shared FFmpeg asset found in recent BtbN autobuilds" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          echo "FFMPEG_DLL_DIR=$dir\bin" >> $env:GITHUB_ENV
          echo "Bundled FFmpeg: $($asset.name)"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/reco-app/package-lock.json

      - name: Install UI dependencies
        working-directory: crates/reco-app
        run: npm ci

      - name: Build UI
        working-directory: crates/reco-app
        run: npm run build

      # ------------------------------------------------------------------
      # macOS signing + notarization (credential-gated)
      # ------------------------------------------------------------------
      # Skipped entirely when APPLE_CERTIFICATE is absent; the build step then
      # produces an ad-hoc-signed (not notarized) `.app`/`.dmg`. No Developer ID
      # signature is ever faked (IN-08).
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
          API_ISSUER: ${{ env.APPLE_API_ISSUER }}
          API_KEY: ${{ env.APPLE_API_KEY }}
          API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo -n "$CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk 'NR==1{print $2}')"
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_API_ISSUER=$API_ISSUER"
            echo "APPLE_API_KEY=$API_KEY"
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH"
          } >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      # ------------------------------------------------------------------
      # Windows Authenticode signing (credential-gated)
      # ------------------------------------------------------------------
      # Imports the OV code-signing cert into the runner store and writes a
      # platform config overlay with its thumbprint, so the Tauri bundler signs
      # the app exe + NSIS/MSI installers during `tauri build`. Skipped (and no
      # overlay written) when WINDOWS_CERTIFICATE is absent → unsigned build.
      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          CERTIFICATE: ${{ env.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ env.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = "$env:RUNNER_TEMP\certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm       = "sha256"
            timestampUrl          = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path "crates/reco-app/tauri.windows.conf.json" -Value $config
          Remove-Item $certPath -Force

      # ------------------------------------------------------------------
      # Build the bundle (Tauri filters `bundle.targets` to the host OS, so the
      # macOS/Windows/Linux entries all coexist in tauri.conf.json).
      # ------------------------------------------------------------------
      - name: Build Tauri app bundle
        working-directory: crates/reco-app
        run: npx tauri build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reco-app-${{ matrix.name }}
          path: |
            target/release/bundle/**/*
            crates/reco-app/target/release/bundle/**/*
          if-no-files-found: warn
